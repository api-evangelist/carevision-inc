name: Carevision Inc.
description: >-
  Carevision Inc. is an AI-powered digital health company whose platform turns any camera into a
  60-second contactless cardiometabolic wellness scanner. Using remote photoplethysmography (rPPG)
  and deep learning models trained on 12M+ patient records, it extracts 30+ physiological parameters
  — including heart rate, blood pressure indicators, stress index, respiratory rate, and oxygen
  saturation — and produces a comprehensive digital health persona covering 15+ cardiometabolic
  conditions. Carevision operates under the FDA General Wellness Policy (it is not a medical device
  or diagnostic tool) and is delivered as a kiosk, an embedded/white-label SDK for iOS and Android,
  or a web integration to hospitals and clinics, health insurers, pharmacy chains, diagnostic
  laboratories, wellness apps, and teleconsultation platforms, integrating with EMR/HIS systems.
